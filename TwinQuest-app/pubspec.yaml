name: pairquest
description: PairQuest UI recreation from the supplied reference image.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.34.4
  permission_handler: ^11.3.1
  http: ^1.2.1
  web_socket_channel: ^3.0.1
  provider: ^6.1.2
  confetti: ^0.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hero_pair.png
    - assets/images/puzzle_landscape.png
